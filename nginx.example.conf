# =============================================================================
#  Autonomous Loop Studio — nginx storage guard (example)
# =============================================================================
#
#  nginx does NOT read .htaccess, so the storage/.htaccess that ships with the
#  app does nothing here. Without the rules below, a default nginx config will
#  happily serve:
#
#      https://yoursite/router/storage/config.json     <- access token + API keys
#      https://yoursite/router/storage/state.json      <- agents, allow/deny lists
#      https://yoursite/router/storage/sessions/*.json <- conversation history
#
#  Drop these `location` blocks inside the server{} that serves the app (or
#  inside the `location /router/ { ... }` block), then:  nginx -t && systemctl
#  reload nginx.
#
#  The strongest fix is to keep storage/ OUTSIDE the document root. If the app
#  must live in the docroot (the one-folder design), the rules below are
#  mandatory.
# -----------------------------------------------------------------------------

# 1) Never expose runtime data or secrets.
location ~ ^/router/(storage|logs|tmp|sessions)/ {
    deny all;
    return 404;   # 404 (not 403) so the folder's existence isn't confirmed
}

# 2) Never serve dotfiles (.htaccess, .git, .env, .htpasswd, ...) anywhere.
#    `well-known` is left open for ACME / Let's Encrypt challenges.
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# 3) Never serve loose data files, even if they land outside storage/ (a stray
#    backup, an export, a php.ini, a key). The API's own JSON does not use a
#    .json URL, so this blocks files only, never an endpoint.
location ~ ^/router/.*\.(json|log|ini|bak|old|sql|key|pem)$ {
    deny all;
    return 404;
}
