# =============================================================================
#  Autonomous Loop Studio — nginx guard (storage + dev tooling)
# =============================================================================
#
#  nginx does NOT read .htaccess, so the storage/.htaccess and tests/.htaccess
#  that ship with the app do nothing here. Without the rules below, a default
#  nginx config will happily serve:
#
#      https://yoursite/router/storage/config.json     <- access token + API keys
#      https://yoursite/router/storage/state.json      <- agents, allow/deny lists
#      https://yoursite/router/storage/sessions/*.json <- conversation history
#      https://yoursite/router/tests/js/run.mjs        <- dev tooling, not runtime
#
#  And the same again for any SECOND copy of the app kept inside the web root --
#  a backup, an archive of an older version, a folder dropped in for reference:
#  each one brings its own storage/ with the same keys in it, so the rules below
#  match those folder names at any depth, not only directly under /router/:
#
#      https://yoursite/router/old-copy/storage/config.json
#      https://yoursite/router/the-copy-before-the-huge-ui-change/storage/config.json
#
#  Drop these `location` blocks inside the server{} that serves the app (or
#  inside the `location /router/ { ... }` block), then:  nginx -t && systemctl
#  reload nginx.
#
#  The strongest fix is to keep storage/ OUTSIDE the document root. If the app
#  must live in the docroot (the one-folder design), the rules below are
#  mandatory.
# -----------------------------------------------------------------------------

# 1) Never expose runtime data, secrets, or dev-only tooling -- as ANY path
#    segment, at any depth. `tests` is not runtime code (serve.php and
#    tests/.htaccess already refuse it), but the guard belongs in every serving
#    mode, not just the two that read .htaccess.
#
#    The `(.+/)?` is what covers a nested copy of the app. This file used to
#    anchor on `^/router/(storage|...)/`, which refused the real folder and left
#    `/router/<any copy>/storage/config.json` wide open -- the same token and
#    keys, one folder down. `~*` makes it case-insensitive, matching the check in
#    serve.php, so a case variant cannot slip past on a case-insensitive disk.
#    It also covers the bare folder with or without a trailing slash, and a file
#    whose NAME merely contains one of these words is not touched
#    (/router/ui/js/tests.js and /router/ui/.../storage.js stay served).
#
#    API routes are exempt (`(?!api/)` after the prefix): they are endpoints, not
#    files. The UI asks for /router/api/sessions to list sessions, and a rule that
#    matched that name broke the sidebar. No API route maps onto a path on disk --
#    the handlers open storage/ themselves, server-side.
location ~* ^/router/(?!(?:.*/)?api/)(?:.+/)?(storage|logs|tmp|sessions|tests)(/|$) {
    deny all;
    return 404;   # 404 (not 403) so the folder's existence isn't confirmed
}

# 2) Never serve dotfiles (.htaccess, .git, .env, .htpasswd, ...) anywhere.
#    `well-known` is left open for ACME / Let's Encrypt challenges.
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# 3) Never serve loose data files, even if they land outside storage/ (a stray
#    backup, an export, a php.ini, a key). The API's own JSON does not use a
#    .json URL, so this blocks files only, never an endpoint. `.*` already spans
#    subdirectories, so a nested copy's config.json is caught here too even if its
#    folders were renamed to something rule 1 does not name.
location ~ ^/router/.*\.(json|log|ini|bak|old|sql|key|pem)$ {
    deny all;
    return 404;
}
